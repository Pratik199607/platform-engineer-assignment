name: Platform Application CI/CD


on:

  push:
    branches:
      - main


permissions:

  contents: read


concurrency:

  group: production-deployment

  cancel-in-progress: false


jobs:

  test:

    name: Test Application

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run tests
        run: |
          pytest -v


  deploy:

    name: Deploy to EC2

    needs:
      - test

    runs-on: ubuntu-latest


    environment:

      name: production


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure SSH

        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

        run: |

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" \
            > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan \
            -H \
            "$EC2_HOST" \
            >> ~/.ssh/known_hosts


      - name: Copy application to EC2

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |

          rsync \
            -az \
            --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".venv" \
            ./ \
            "${EC2_USER}@${EC2_HOST}:/tmp/platform-deploy/"


      - name: Deploy application

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |

          ssh \
            "${EC2_USER}@${EC2_HOST}" \
            "cd /tmp/platform-deploy && bash scripts/deploy.sh /tmp/platform-deploy"


      - name: Verify deployment

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

        run: |

          ssh \
            "${EC2_USER}@${EC2_HOST}" \
            "bash /opt/platform/current/scripts/health_check.sh"